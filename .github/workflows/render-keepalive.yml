name: Sentinel AWS Health Check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Sentinel API readiness
        run: |
          curl --fail --silent --show-error --max-time 60 https://sentinel-api.3.208.71.125.sslip.io/readiness
      - name: Ping Sentinel web shell
        run: |
          curl --fail --silent --show-error --max-time 60 --header "Accept: text/html" https://sentinel-api.3.208.71.125.sslip.io/
