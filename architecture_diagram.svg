<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" role="img" aria-labelledby="title desc">
  <title id="title">Sentinel architecture diagram</title>
  <desc id="desc">Application logs flow into Splunk, Splunk alerts trigger Sentinel, Sentinel investigates and acts, then writes post-mortems back to Splunk.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f4a57"/>
    </marker>
    <style>
      svg { background: #ffffff; color: #17202a; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tier { fill: #f7f9fb; stroke: #d9e0e8; stroke-width: 0.5px; }
      .node { stroke-width: 0.5px; }
      .line { fill: none; stroke: #3f4a57; stroke-width: 0.5px; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #3f4a57; stroke-width: 0.5px; stroke-dasharray: 4 4; marker-end: url(#arrow); }
      .label { fill: #5c6673; font-size: 11px; }
      .tier-label { fill: #778190; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .th { fill: #17202a; font-size: 14px; font-weight: 700; }
      .ts { fill: #53606f; font-size: 12px; }
      .c-blue { fill: #eaf3ff; stroke: #7fb1e8; }
      .c-teal { fill: #e7f8f5; stroke: #67beb2; }
      .c-amber { fill: #fff5df; stroke: #d7a33e; }
      .c-green { fill: #e9f8ee; stroke: #6fbd7e; }
      .c-gray { fill: #f3f5f7; stroke: #a8b3bf; }
      .c-purple { fill: #f2edff; stroke: #a18add; }
    </style>
  </defs>

  <rect class="tier" x="24" y="24" width="632" height="472" rx="12"/>
  <text class="tier-label" x="42" y="50">Sentinel production path</text>

  <rect class="node c-blue" x="215" y="64" width="250" height="44" rx="8"/>
  <text class="th" x="340" y="84" text-anchor="middle">Your application</text>
  <text class="ts" x="340" y="99" text-anchor="middle">payment-service or any app</text>

  <text class="tier-label" x="42" y="140">Splunk platform</text>
  <rect class="node c-teal" x="42" y="154" width="135" height="58" rx="8"/>
  <text class="th" x="109.5" y="178" text-anchor="middle">Splunk HEC</text>
  <text class="ts" x="109.5" y="195" text-anchor="middle">index=prod logs</text>

  <rect class="node c-amber" x="195" y="154" width="135" height="58" rx="8"/>
  <text class="th" x="262.5" y="178" text-anchor="middle">Saved search</text>
  <text class="ts" x="262.5" y="195" text-anchor="middle">alert action</text>

  <rect class="node c-purple" x="350" y="154" width="135" height="58" rx="8"/>
  <text class="th" x="417.5" y="178" text-anchor="middle">KV Store brain</text>
  <text class="ts" x="417.5" y="195" text-anchor="middle">incidents + runbooks</text>

  <rect class="node c-green" x="503" y="154" width="135" height="58" rx="8"/>
  <text class="th" x="570.5" y="178" text-anchor="middle">Sentinel index</text>
  <text class="ts" x="570.5" y="195" text-anchor="middle">post-mortems + dashboard</text>

  <text class="tier-label" x="42" y="258">Sentinel core</text>
  <rect class="node c-gray" x="70" y="272" width="155" height="62" rx="8"/>
  <text class="th" x="147.5" y="296" text-anchor="middle">Webhook handler</text>
  <text class="ts" x="147.5" y="313" text-anchor="middle">Splunk alert payload</text>

  <rect class="node c-blue" x="263" y="272" width="155" height="62" rx="8"/>
  <text class="th" x="340.5" y="296" text-anchor="middle">8-phase loop</text>
  <text class="ts" x="340.5" y="313" text-anchor="middle">assess to verify to close</text>

  <rect class="node c-teal" x="456" y="272" width="155" height="62" rx="8"/>
  <text class="th" x="533.5" y="296" text-anchor="middle">Splunk MCP adapter</text>
  <text class="ts" x="533.5" y="313" text-anchor="middle">SPL + KV Store access</text>

  <text class="tier-label" x="42" y="394">Operator surfaces</text>
  <rect class="node c-blue" x="118" y="408" width="185" height="58" rx="8"/>
  <text class="th" x="210.5" y="432" text-anchor="middle">Sentinel web app</text>
  <text class="ts" x="210.5" y="449" text-anchor="middle">live SSE reasoning stream</text>

  <rect class="node c-amber" x="378" y="408" width="185" height="58" rx="8"/>
  <text class="th" x="470.5" y="432" text-anchor="middle">Slack escalation</text>
  <text class="ts" x="470.5" y="449" text-anchor="middle">oncall context when needed</text>

  <path class="line" d="M 340 108 L 340 128 L 109.5 128 L 109.5 153"/>
  <text class="label" x="229" y="122" text-anchor="middle">application logs</text>

  <path class="line" d="M 177 183 L 194 183"/>
  <path class="line" d="M 262.5 212 L 262.5 236 L 147.5 236 L 147.5 271"/>
  <text class="label" x="226" y="231" text-anchor="middle">POST alert webhook</text>

  <path class="line" d="M 225 303 L 262 303"/>
  <path class="line" d="M 418 303 L 455 303"/>
  <text class="label" x="438" y="289" text-anchor="middle">live SPL + memory</text>

  <path class="line" d="M 533.5 272 L 533.5 235 L 417.5 235 L 417.5 213"/>
  <path class="line" d="M 533.5 272 L 533.5 235 L 570.5 235 L 570.5 213"/>

  <path class="line" d="M 316 334 L 230 407"/>
  <path class="line" d="M 365 334 L 449 407"/>
  <text class="label" x="327" y="372" text-anchor="middle">state + decisions</text>

  <path class="loop" d="M 552 404 C 642 364, 640 236, 570.5 212"/>
  <text class="label" x="611" y="313" text-anchor="middle">post-mortems</text>

  <path class="loop" d="M 417.5 154 C 380 122, 312 122, 262.5 154"/>
  <text class="label" x="340" y="133" text-anchor="middle">learned context affects next alert</text>
</svg>
